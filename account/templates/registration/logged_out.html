{% extends "blog/base.html" %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center pt-8 text-center">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Logged Out</h2>
    <p class="text-sm text-gray-600 mb-6">
        You have been successfully logged out.
    </p>
    <a href="{% url 'login' %}" 
       class="inline-block rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-100">
        Log-in again
    </a>
</div>
{% endblock %}
