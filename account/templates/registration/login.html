{% extends "blog/base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center pt-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Log In</h2>
    
    <form method="post" class="w-full max-w-xs space-y-4">
        {% csrf_token %}
        
        <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" id="id_username" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
        </div>
        
        <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
        </div>
        
        <div class="text-center pt-2">
            <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-100">
                Log In
            </button>
        </div>
    </form>

    <div class="mt-4 text-center text-xs text-gray-500 space-y-1">
        <p><a href="{% url 'password_reset' %}" class="hover:underline">Forgot your password?</a></p>
        <p>Don't have an account? <a href="#" class="font-medium text-gray-800 hover:underline">Register here</a></p>
    </div>
</div>
{% endblock %}
