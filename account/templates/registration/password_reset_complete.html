{% extends "blog/base.html" %}

{% block title %}Password reset{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center pt-8 text-center max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Password set</h1>
    
    <p class="text-xs text-gray-600 mb-6">
        Your password has been set. You can 
        <a href="{% url 'login' %}" class="font-medium text-gray-900 underline hover:text-blue-600 transition-colors">
            log in now
        </a>.
    </p>

    <a href="{% url 'login' %}" 
       class="inline-block rounded-md border border-gray-300 px-4 py-2 text-xs font-medium text-gray-800 hover:bg-gray-100 transition-colors">
        Log In
    </a>
</div>
{% endblock %}
