{% extends "blog/base.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center pt-8 text-center max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Password changed</h1>
    <p class="text-xs text-gray-500 mb-6">Your password has been successfully changed.</p>
    
    <a href="{% url 'blog:post_list' %}" 
       class="inline-block rounded-md border border-gray-300 px-4 py-2 text-xs font-medium text-gray-800 hover:bg-gray-100 transition-colors">
        Back to posts
    </a>
</div>
{% endblock %}
