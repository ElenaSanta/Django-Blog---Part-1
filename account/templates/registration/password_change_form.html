{% extends "blog/base.html" %}

{% block title %}Change your password{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center pt-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Change your password</h1>
    <p class="text-xs text-gray-500 mb-6 text-center">Use the form below to change your password.</p>

    <form method="post" class="w-full max-w-xs space-y-4">
        <div class="text-xs text-gray-700 space-y-3">
            {{ form.as_p }}
        </div>
        
        {% csrf_token %}

        <div class="text-center pt-2">
            <input type="submit" 
                   value="Change" 
                   class="cursor-pointer rounded-md border border-gray-300 px-4 py-2 text-xs font-medium text-gray-800 hover:bg-gray-100 transition-colors">
        </div>
    </form>
</div>
{% endblock %}
