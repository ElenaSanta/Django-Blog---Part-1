{% extends "blog/base.html" %}

{% block title %}Reset Your Password{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center pt-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Reset Your Password</h2>
    <p class="text-xs text-gray-500 mb-6">Enter your email address to receive password reset instructions.</p>
    
    <form method="post" class="w-full max-w-xs space-y-4">
        {% csrf_token %}
        <div class="flex items-center space-x-2">
            <label for="id_email" class="text-sm font-medium text-gray-700 w-16">Email:</label>
            <input type="email" name="email" id="id_email" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
        </div>
        
        <div class="text-center pt-2">
            <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-100">
                Reset Password
            </button>
        </div>
    </form>
</div>
{% endblock %}
