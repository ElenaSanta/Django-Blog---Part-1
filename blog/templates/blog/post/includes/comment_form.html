<h2 class="text-lg font-bold text-gray-900 mb-4">Add a new comment</h2>

<form action="{% url 'blog:post_comment' post.id %}" method="post" class="space-y-4 max-w-sm">
    {% csrf_token %}
    <div class="text-xs text-gray-700 space-y-3">
        {{ form.as_p }}
    </div>
    <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-xs font-medium text-gray-800 hover:bg-gray-100">
        Add comment
    </button>
</form>
