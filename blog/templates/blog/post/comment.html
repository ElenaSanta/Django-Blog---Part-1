{% extends "blog/base.html" %}

{% block title %}Add a comment{% endblock %}

{% block content %}
<div class="max-w-md mx-auto pt-4">
    {% if comment %}
        <div class="text-center space-y-4">
            <h2 class="text-2xl font-bold text-gray-900">Your comment has been added.</h2>
            <div class="pt-2">
                <a href="{{ post.get_absolute_url }}" class="inline-block rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-100">
                    Back to the post
                </a>
            </div>
        </div>
    {% else %}
        {% include "blog/post/includes/comment_form.html" %}
    {% endif %}
</div>
{% endblock %}
