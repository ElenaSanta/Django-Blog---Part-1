<!--
Το αρχειο base.html περιεχει το βασικο html template που χρησιμοποιειται σε ολες τις σελιδες της εφαρμογης. 
Περιεχει τα βασικα head και body και ενα μπλοκ content που θα αντικατασταθει απο τα υπολοιπα templates.
-->

<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-gray-900">
    <div class="mx-auto max-w-4xl px-6 py-12 sm:py-16">
        <!-- Header -->
        <header class="flex items-start justify-between border-b border-gray-100 pb-8 mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl">
                    <a href="{% url 'blog:post_list' %}">From the blog</a>
                </h1>
                <p class="mt-2 text-lg text-gray-500">Lorem ipsum</p>
            </div>
            <div>
                {% if request.user.is_authenticated %}
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="inline-block rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Login</a>
                {% endif %}
            </div>
        </header>

        <!-- Main Content -->
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
